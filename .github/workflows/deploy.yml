name: Test and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/joshuaslui/dakarbot

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Import every module
        run: |
          pip install -r requirements.txt
          python -m compileall -q dakarbot main.py
          python -c "import importlib, pkgutil, dakarbot; [importlib.import_module(m.name) for m in pkgutil.walk_packages(dakarbot.__path__, 'dakarbot.')]"

  image:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    concurrency: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy over SSH
        # Host and its key are secrets because the repo is public and they reveal the server's IP.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for s in DEPLOY_SSH_KEY DEPLOY_HOST DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!s}" ]; then echo "::error::$s secret is not set"; exit 1; fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server only accepts this key to run its deploy script, given a commit and registry token.
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy \
            -o StrictHostKeyChecking=yes "dakarbot@$DEPLOY_HOST" "$GITHUB_SHA"
